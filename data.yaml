# =========================================================================================
# UI & BUTTON SETTINGS
# =========================================================================================
settings:
  # Page Content Max Width (Default is 1024px. Set e.g. "1200px", "900px", or leave empty "" for 1024px)
  max_width: "1024px"

  # Top Navigation Bar Options
  nav_shadow: true # Set to true to show a subtle box-shadow under top navbar, or false for no shadow
  nav_scroll_highlight: true # Set to true to highlight active navbar section link while scrolling
  nav_highlight_color: "" # Optional custom highlight color (e.g., "#3498db", "#e74c3c" or leave empty "" for default)

  # Dark / Light Mode Toggle Button
  theme_toggle_text: "Toggle Dark Mode"
  theme_toggle_color: "" # Optional custom color (e.g., "#517599" or leave empty for CSS default)

  # Copy BibTeX Button
  copy_bibtex_text: "Copy to Clipboard"
  copy_bibtex_icon: "📋"
  copy_bibtex_color: "" # Optional custom color (e.g., "#517599" or leave empty for CSS default)

  # Scroll To Top Button
  scroll_top_text: "⬆"
  scroll_top_color: "" # Optional custom color (e.g., "#517599" or leave empty for CSS default)

